<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Jot editor</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="editor.css">
  <script defer src="editor.js"></script>
</head>
<body>
  <div id="toolbar" role="toolbar" aria-label="Text formatting">
    <select id="block-type" aria-label="Text style" title="Text style">
      <option value="paragraph">Text</option>
      <option value="heading1">Heading 1</option>
      <option value="heading2">Heading 2</option>
      <option value="heading3">Heading 3</option>
    </select>
    <span class="divider"></span>
    <button data-command="toggleBold" title="Bold (⌘B)" aria-label="Bold" data-icon="bold"></button>
    <button data-command="toggleItalic" title="Italic (⌘I)" aria-label="Italic" data-icon="italic"></button>
    <button data-command="toggleStrike" title="Strikethrough (⌘⇧S)" aria-label="Strikethrough" data-icon="strikethrough"></button>
    <button data-command="toggleCode" title="Inline code (⌘E)" aria-label="Inline code" data-icon="code"></button>
    <span class="divider"></span>
    <button data-command="toggleBulletList" title="Bullet list (⌘⇧8)" aria-label="Bullet list" data-icon="list"></button>
    <button data-command="toggleOrderedList" title="Numbered list (⌘⇧7)" aria-label="Numbered list" data-icon="list-ordered"></button>
    <button data-command="toggleTaskList" title="Checklist (⌘⇧9)" aria-label="Checklist" data-icon="list-todo"></button>
    <button data-command="toggleCodeBlock" title="Code block (⌘⌥C)" aria-label="Code block" data-icon="square-code"></button>
    <button data-command="link" title="Link (⌘K)" aria-label="Add or edit link" data-icon="link"></button>
    <span class="flex-space"></span>
    <button data-command="undo" title="Undo (⌘Z)" aria-label="Undo" data-icon="undo-2"></button>
    <button data-command="redo" title="Redo (⌘⇧Z)" aria-label="Redo" data-icon="redo-2"></button>
    <button id="show-find" title="Find in note (⇧⌘F)" aria-label="Find in note" data-icon="search"></button>
  </div>
  <form id="find-bar" hidden role="search" aria-label="Find in note">
    <input id="find-input" type="search" placeholder="Find in note" aria-label="Find in note" autocomplete="off" spellcheck="false">
    <output id="find-count" aria-live="polite"></output>
    <button type="button" id="find-prev" title="Previous match" aria-label="Previous match" data-icon="arrow-up"></button>
    <button type="submit" id="find-next" title="Next match" aria-label="Next match" data-icon="arrow-down"></button>
    <button type="button" id="find-close" title="Close find (Escape)" aria-label="Close find" data-icon="x"></button>
  </form>
  <form id="link-bar" hidden aria-label="Edit link">
    <input id="link-input" type="text" placeholder="https://example.com" aria-label="Link address" autocomplete="off" spellcheck="false">
    <button type="submit">Apply</button>
    <button type="button" id="link-remove">Remove</button>
    <button type="button" id="link-close" aria-label="Cancel link" data-icon="x"></button>
  </form>
  <main id="scroller" aria-label="Note content"><div id="documents"></div></main>
</body>
</html>
